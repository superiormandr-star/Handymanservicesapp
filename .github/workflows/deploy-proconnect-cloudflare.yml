name: Verify Superior ProConnect for Cloudflare Builds
on:
  push:
    branches:
      - superior-proconnect-2-workers-production
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and unit tests
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
      - name: Cloudflare deployment ownership
        run: |
          echo "Cloudflare Workers Builds is the production deploy system."
          echo "No GitHub CLOUDFLARE_API_TOKEN is needed."
          echo "Worker: superior-proconnect-2"
          echo "Branch: superior-proconnect-2-workers-production"
