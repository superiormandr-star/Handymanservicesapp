name: OneDrive backup and recovery regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/onedrive-verify.yml
      - onedrive.js
      - persistent-store.js
      - server.js
      - tests/onedrive*.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This exercises mocked Graph. Production backup status comes from the
      # application's authenticated nightly backup and owner Backups screen.
      - name: Test encryption, Graph upload, download, and recovery
        run: node --test tests/onedrive.mjs tests/onedrive-appfolder-repair.mjs
