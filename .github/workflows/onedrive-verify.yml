name: Encrypted OneDrive record backup and recovery verification
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Back up actual records and verify upload and decrypted recovery
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_REFRESH_TOKEN: ${{ secrets.MICROSOFT_REFRESH_TOKEN }}
          ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          ADMIN_TOKEN: ${{ secrets.PROCONNECT_BACKUP_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const {uploadAndVerify}=require('./onedrive-backup');
          const {validateBackup}=require('./onedrive');
          (async()=>{
            if(!process.env.ADMIN_TOKEN)throw Error('Actual-record backup authorization is not configured.');
            const response=await fetch('https://superior-proconnect.vercel.app/api/admin/export',{headers:{'X-Admin-Token':process.env.ADMIN_TOKEN},signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error('Private record export failed ('+response.status+').');
            const records=validateBackup(await response.text());
            const result=await uploadAndVerify(records,{filename:'proconnect-records-'+Date.now()+'-'+require('node:crypto').randomUUID()+'.json.enc'});
            console.log('VERIFIED encrypted upload and decrypted recovery:',JSON.stringify({bytes:result.bytes,sha256:result.sha256,verifiedAt:result.verifiedAt}));
          })().catch(error=>{console.error('NOT VERIFIED:',error.message);process.exitCode=1;});
          NODE
