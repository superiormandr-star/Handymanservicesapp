name: Refresh approved ProConnect app icons
on:
  workflow_dispatch:
  push:
    branches:
      - feature/paypal-membership-lifecycle-20261115
    paths:
      - .github/workflows/refresh-app-icons.yml
permissions:
  contents: write
jobs:
  approved-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PWA icons from the approved ProConnect master logo
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          source=Path('public/logos/Superior_ProConnect_Master.jpg')
          if not source.is_file():
              raise SystemExit('Approved master artwork absent: refuse icon substitution')
          with Image.open(source) as art:
              if art.width < 512 or art.height < 512:
                  raise SystemExit('Master artwork is too small for app icons')
              art=ImageOps.exif_transpose(art).convert('RGB')
              side=max(art.size)
              square=Image.new('RGB',(side,side),art.getpixel((0,0)))
              square.paste(art,((side-art.width)//2,(side-art.height)//2))
              out=Path('public/icons');out.mkdir(parents=True,exist_ok=True)
              for size,name in ((192,'icon-192.png'),(512,'icon-512.png'),(180,'apple-touch-icon.png')):
                  icon=square.resize((size,size),Image.Resampling.LANCZOS)
                  icon.save(out/name,format='PNG',optimize=True)
                  print(name,icon.size)
          PY
      - name: Commit image assets to development branch
        run: |
          git add public/icons/icon-192.png public/icons/icon-512.png public/icons/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo 'Approved icons already current'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate installed app icons from approved master logo'
          git push origin HEAD:feature/paypal-membership-lifecycle-20261115
