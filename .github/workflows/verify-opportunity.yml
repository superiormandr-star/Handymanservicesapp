name: Verify Opportunity Engine
on:
  pull_request:
    branches: [superior-proconnect-2-workers-production]
  push:
    branches: [feature/proconnect-opportunity-engine]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudflare/opportunity.mjs && node --check public/opportunity.js && node --check cloudflare/worker.mjs
      - run: node --test tests/opportunity.mjs
      - run: npm install --no-package-lock --no-audit --no-fund && npm test
